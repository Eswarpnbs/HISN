- clause_id: UAE-FL-2-2019-ART13
  record_id: UAE-FL-2-2019
  article: "Article (13)"
  basis: FEDERAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m10, d10_m06]
  y3172_nodes: [P, C]
  text: 'It is not permissible to store, process, generate or transform the health data and information outside State -which are related to the health services provided inside State- except in the case where a resolution is issued from the Health Authority in coordination with the Ministry.'
- clause_id: UAE-FL-2-2019-ART24
  record_id: UAE-FL-2-2019
  article: "Article (24)"
  basis: FEDERAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [P]
  text: 'Whoever violates the provision of Article (13) of this Law shall be punished of a penalty of no less than (500.000) five hundred thousand dirhams and no more than (700.000) seven hundred thousand dirhams.'
- clause_id: UAE-TDRA-UEC-1.10
  record_id: UAE-TDRA-UEC-2022
  article: "Clause 1.10"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m04, d10_m06]
  y3172_nodes: [P]
  text: 'Unsolicited Electronic Communications (Spam): means Marketing Electronic Communications sent to a Recipient without obtaining that Recipient’s Consent;'
- clause_id: UAE-TDRA-UEC-6.1
  record_id: UAE-TDRA-UEC-2022
  article: "Clause 6.1"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [P, SINK]
  text: 'Licensees shall be under a full obligation to put in place all practical measures to minimize the transmission of Spam having a UAE Link across their Telecommunications Networks.'
- clause_id: UAE-TDRA-UEC-11.1
  record_id: UAE-TDRA-UEC-2022
  article: "Clause 11.1"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [C, P]
  text: 'Licensees shall monitor their networks for signs of Mobile Spam and take immediate practical actions to eliminate such Spam.'
- clause_id: UAE-TDRA-UEC-13
  record_id: UAE-TDRA-UEC-2022
  article: "Clause 13 (Exemption of the Government)"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m04]
  y3172_nodes: [P]
  text: 'This policy shall not apply to any Mobile Marketing Text Message sent by any government entity except for Charities or any other entity specified by TDRA as required. It shall also not apply to any licensee with respect to the transmission of these Mobile Marketing Text Messages.'
- clause_id: UAE-PDPL-ART2-2
  record_id: UAE-PDPL-2021
  article: "Article (2)(2)(a)-(e)"
  basis: FEDERAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m10, d10_m04]
  y3172_nodes: [SRC, PP]
  text: 'Provisions of this Decree by Law shall not apply to the following: a. Government Data b. Governmental entities which control or process Personal Data. c. Personal Data held by the security and judicial authorities d. A Data Subject who processes his/her data for personal purposes. e. Personal Health Data that has legislation regulating its protection and processing.'
- clause_id: UAE-FL-2-2019-ART1-CIRC
  record_id: UAE-FL-2-2019
  article: "Article (1) - Circulation of Health Information"
  basis: FEDERAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m10]
  y3172_nodes: [C, PP, D]
  text: 'Circulation of Health Information: Accessing, exchanging, copying, photocopying, transforming, storing, publishing, disclosing or sending the health data and information.'
- clause_id: UAE-FL-2-2019-ART16
  record_id: UAE-FL-2-2019
  article: "Article (16) (list layout reconstructed from PDF extraction)"
  basis: FEDERAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m10, d10_m06]
  y3172_nodes: [PP, M]
  text: 'Without violation to any applicable legislations, whoever circulates information related to the patients must keep its confidentiality and not to use them except in the health purposes without written approval from the patient, except in any of the following cases: 1. The health data or information requested by the health insurance companies or any authority funding the health services regarding the health services received by the patient, for the review, approval or verification of the financial entitlements related to such services. 2. Purposes of the scientific and clinical research, provided that not to disclose the identity of the patients and to observe the morals and rules of the scientific researches. 3. To take the preventive and curative procedures related to the public health or to keep the health and safety of the patient or any other person contacting him. 4. Upon a request by the competent judicial authorities. 5. Upon a request by the Health Authority for purposes of monitoring and inspection and keeping the public health.'
- clause_id: UAE-AI-CHARTER-P5
  record_id: UAE-AI-CHARTER-2024
  article: "Principle 5 - Transparency"
  basis: SOFT_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m07]
  y3172_nodes: [D, SINK]
  text: 'Transparency: The UAE seeks to create a clear understanding of AI and how systems operate and make decisions, which helps build trust, enhance responsibility, and accountability in the use of these technologies.'
- clause_id: UAE-AI-CHARTER-P6
  record_id: UAE-AI-CHARTER-2024
  article: "Principle 6 - Human Oversight"
  basis: SOFT_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [P]
  text: 'Human Oversight: The Charter emphasizes the irreplaceable value of human judgment and human oversight over AI, aligning with ethical values and social standards to correct any errors or biases that may arise.'
- clause_id: UAE-AI-CHARTER-P7
  record_id: UAE-AI-CHARTER-2024
  article: "Principle 7 - Governance and Accountability"
  basis: SOFT_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m09]
  y3172_nodes: [P, MLFO]
  text: 'Governance and Accountability: The UAE adopts a responsible and proactive stance, emphasizing the importance of governance and accountability in AI to ensure the technology is used ethically and transparently.'
- clause_id: UAE-AI-CHARTER-P2
  record_id: UAE-AI-CHARTER-2024
  article: "Principle 2 - Safety (two-column layout; sentence-to-heading alignment checked against page 3)"
  basis: SOFT_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [P, Sandbox]
  text: 'The UAE places great importance on safety, ensuring that all AI systems comply with the highest safety standards. The country encourages modifying or removing systems that pose risks.'
- clause_id: UAE-FL-2-2019-ART4
  record_id: UAE-FL-2-2019
  article: "Article (4) (list layout reconstructed from PDF extraction)"
  basis: FEDERAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06, d10_m10]
  y3172_nodes: [P, D, SINK]
  text: 'Upon using the information and communication technology in the areas of health, it shall be committed to the following: 1. To keep the confidentiality of health data and information by not allowing to circulate them in cases other than the permitted. 2. To ensure the validity and credibility of the health data and information by keeping their safety from the non-authorised damage, amendment, alteration, deletion or addition. 3. To ensure the availability of health data and information to the authorised thereof and facilitate the access thereto, if needed.'
- clause_id: UAE-TDRA-UEC-11.2
  record_id: UAE-TDRA-UEC-2022
  article: "Clause 11.2"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [P, SINK]
  text: 'Licensees shall provide practical protections for their Mobile Customers from Mobile Spam and shall provide measures and mechanisms to ensure the same.'
- clause_id: UAE-TDRA-UEC-8.5.3
  record_id: UAE-TDRA-UEC-2022
  article: "Clause 8.5 (lead) and 8.5.3 - excerpt"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m05]
  y3172_nodes: [SINK]
  text: 'The Licensees shall provide Mobile Customers with information and resources to help them minimize the level and impact of Mobile Spam. These shall include: [...] 8.5.3 the provision of Mobile Spam reporting facilities, including for example, through their respective customer service contacts, websites or by forwarding suspected Mobile Spam to licensees via a "short code".'
- clause_id: IN-DPDP-S4-1
  record_id: IN-DPDP-2023
  article: "Section 4(1)"
  basis: NATIONAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m10]
  y3172_nodes: [SRC, PP]
  text: 'A person may process the personal data of a Data Principal only in accordance with the provisions of this Act and for a lawful purpose,— (a) for which the Data Principal has given her consent; or (b) for certain legitimate uses.'
- clause_id: IN-DPDP-S7-FGH
  record_id: IN-DPDP-2023
  article: "Section 7(f)-(h) (excerpt; s.4(1)(b) refers to these as certain legitimate uses)"
  basis: NATIONAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m10, d10_m06]
  y3172_nodes: [PP, P]
  text: '(f) for responding to a medical emergency involving a threat to the life or immediate threat to the health of the Data Principal or any other individual; (g) for taking measures to provide medical treatment or health services to any individual during an epidemic, outbreak of disease, or any other threat to public health; (h) for taking measures to ensure safety of, or provide assistance or services to, any individual during any disaster, or any breakdown of public order.'
- clause_id: IN-DPDP-S16
  record_id: IN-DPDP-2023
  article: "Section 16"
  basis: NATIONAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m10]
  y3172_nodes: [C, D]
  text: '(1) The Central Government may, by notification, restrict the transfer of personal data by a Data Fiduciary for processing to such country or territory outside India as may be so notified. (2) Nothing contained in this section shall restrict the applicability of any law for the time being in force in India that provides for a higher degree of protection for or restriction on transfer of personal data by a Data Fiduciary outside India in relation to any personal data or Data Fiduciary or class thereof.'
- clause_id: IN-DPDP-S17-2A
  record_id: IN-DPDP-2023
  article: "Section 17(2)(a)"
  basis: NATIONAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m04]
  y3172_nodes: [P]
  text: '(2) The provisions of this Act shall not apply in respect of the processing of personal data— (a) by such instrumentality of the State as the Central Government may notify, in the interests of sovereignty and integrity of India, security of the State, friendly relations with foreign States, maintenance of public order or preventing incitement to any cognizable offence relating to any of these, and the processing by the Central Government of any personal data that such instrumentality may furnish to it;'
- clause_id: IN-TEL-S20-1
  record_id: IN-TELECOM-ACT-2023
  article: "Section 20(1) (in-force status: verify commencement notification)"
  basis: NATIONAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [D, SINK]
  text: '(1) On the occurrence of any public emergency, including disaster management, or in the interest of public safety, the Central Government or a State Government or any officer specially authorised in this behalf by the Central Government or a State Government, if satisfied that it is necessary or expedient so to do, by notification— (a) take temporary possession of any telecommunication service or telecommunication network from an authorised entity; or (b) provide for appropriate mechanism to ensure that messages of a user or group of users authorised for response and recovery during public emergency are routed on priority.'
- clause_id: IN-TEL-S28-1
  record_id: IN-TELECOM-ACT-2023
  article: "Section 28(1) (in-force status: verify commencement notification)"
  basis: NATIONAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m04, d10_m06]
  y3172_nodes: [P]
  text: 'For the purposes of this section, "specified message" means any message offering, advertising or promoting goods, services, interest in property, business opportunity, employment opportunity or investment opportunity, whether or not— (a) the goods, services, interest, or opportunity are real; or (b) it is lawful to acquire such goods, services, property, interest or take up the opportunity.'
- clause_id: IN-TEL-S28-2
  record_id: IN-TELECOM-ACT-2023
  article: "Section 28(2) (in-force status: verify commencement notification)"
  basis: NATIONAL_LAW
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m05, d10_m06]
  y3172_nodes: [SINK]
  text: '(2) The Central Government may by rules provide for measures for protection of users, in consonance with any regulations notified by the Telecom Regulatory Authority of India from time to time, including measures such as— (a) the prior consent of users for receiving certain specified messages or class of specified messages; (b) the preparation and maintenance of one or more registers, to be called as "Do Not Disturb" register, to ensure that users do not receive specified messages or class of specified messages without prior consent; or (c) the mechanism to enable users to report any malware or specified messages received in contravention of this section.'
- clause_id: IN-TRAI-HEADER-REGISTER
  record_id: IN-TRAI-TCCCPR-CONS
  article: "Regulation 2 - definitions of Header Register and Header Registrar (TRAI consolidated text; gazetted text prevails)"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06, d10_m09]
  y3172_nodes: [SRC, C, P]
  text: '“Header Register” means a Distributed Ledger for Header (DL-Header) which keeps records of header(s), its purpose of sending commercial communications and details of sender to whom it is assigned in a safe and secure manner; “Header Registrar” is an authorised entity under relevant regulations responsible for maintaining the header register, header registration facility and header verification facility;'
- clause_id: IN-TRAI-REG33-1
  record_id: IN-TRAI-TCCCPR-CONS
  article: "Regulation 33(1) (TRAI consolidated text; gazetted text prevails)"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [P, MLFO]
  text: '(1)Where the Authority has reason to believe that any registered or unregistered Sender of Commercial Communications has contravened the provisions of these regulations and the Access Provider has not taken action against such Sender as provided under these regulations, the Authority may order or direct the Access Provider to take action against such Sender as per the provisions of the regulations.'
