  - C
  - P
  text: '“Government Message or Government Voice Call” means any message sent or voice call made on the directions of – (a) the Central Government or the State Government or any body established under the Constitution; or (b) the Authority or by an agency expressly authorized for the purpose by the Authority: Provided that such messages are sent or voice calls are made through the DLT platform. Explanation: There shall not be any requirement of seeking Consent for receipt of these communications nor shall there be any option in the Preference Register to block such communications;'
