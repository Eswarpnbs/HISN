  text: Whoever illegally seizes for himself or for third parties a movable asset, a benefit or a document or signs this document through the use of any of the fraud techniques, or through taking an alias or false impersonation through the information network, IS or any ITE shall be punished with imprisonment for at least one year and/ or a fine of not less than (AED 250,000) two hundred fifty thousand dirhams or more than (AED 1,000,000) one million dirhams.
