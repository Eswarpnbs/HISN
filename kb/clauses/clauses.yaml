  article: "Clause 6.1"
  basis: REGULATOR_POLICY
  dimension_ids: [10]
  factor: sandbox
  metric_ids: [d10_m06]
  y3172_nodes: [P, SINK]
  text: 'Licensees shall be under a full obligation to put in place all practical measures to minimize the transmission of Spam having a UAE Link across their Telecommunications Networks.'
- clause_id: UAE-TDRA-UEC-11.1
