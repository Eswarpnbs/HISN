- record_id: UAE-TELECOM-2003
  article: '14'
  text_ar: 'المادة (14) تختص البيئة باصدار التراخيص وفقا لاحكام القانون وكذلك الانظمة والتعليمات والقرارات والقواعد المنظمة لما 1. التعرفة والاجور والرسوم التي يحصلها المرخص لهم وفقا لما يحدده مجلس الادارة. 2 كل ما يتعلق بالاستخدام والربط بشبكات الاتصالات وخدمات الاتصالات التي يقدمها المرخص لهم: وحق اشتراك المرخص لهم في المواقع والمشاركة في البنية التحتية», بما في ذلك الشروط الخاصة بتكلفة الربط وحق الاستخدام والمشاركة في المواقع والفترات الزمنية ومبادئ التفاوض واستكمال الاتفاقيات بين الجبات العاملة في شان ما تقدمء وكذلك وضع قواعد حل النزاعات بين اطراف تلك الاتفاقيات. 3. شروط ومستوي ونطاق الخدمات التي يقدمها المرخص لهم للمشتركين والخدمات الشمولية والخدمات الطارئة, بما في ذلك معايير جودة الخدمات المقدمة وشروط تقديم الخدمات والفصل في شكاوي المشتركين والنزاعات وتزويد المشتركين بالمعلومات واستخدام المعلومات الخاصة بالمشتركين وتزويدهم بالفواتير. 4. تنظيم وتامين المنافسة في قطاع الاتصالات بما لا يخل بالقوانين والانظمة النافذة. 5. طلب اية معلومات لازمة لانشطة البيئة. 6. وضع مواصفات المعدات المستخدمة
    من قبل المرخص لهم.ء بما في ذلك المعايير الفنية وانواع تلك المعدات. 7. استيراد وتصنيع واستخدام اجهزة الاتصالات والتعامل معباء والتصاريح الخاصة بهذه الاجهزة. 8. تخصيص ارقام الهواتف. ووضع الخطة الخاصة بالترقيم ونقل الارقام. 9 تنظيم استخدام الطيف الترددي وفقا لاحكام القانون» بما في ذلك تخصيص واعادة تخصيص واستخدام تلك الترددات ومنح التصاريح الخاصة بها. مرسوم بقانون اتحادي لسنة 2003 في شان تنظيم قطاع الاتصالات ظ 6 0. شروط توفير واعداد وتزويد خدمات الاستعلامات والدليل. 1. اصدار ضوابط منع تشويش الاتصالات بالدولة عن طريق موجات راديوية او كهربائية او اية وسائل اخري. 2. تاهيل الاشخاص للقيام باعمال تركيب وتوصيل وتعديل وصيانة اجهزة الاتصالات. 3. نشر الاعلانات الخاصة باجهزة الاتصالات. 4 . الاعمال الاخري التي تكلف بها من قبل مجلس الوزراء. 5. اقتراح واعداد الاستراتيجيات والسياسات والتشريعات المتعلقة بالتطور الرقمي المتكامل لحكومة الامارات» بما يشمل الشبكات والانظمة والبرامج والخدمات والمنصات الرقمية» ومتابعة تنفيذها بعد اعتمادها من مجلس الوزراء. 6. اقتراح وااعداد وتنفيذ الانظمة والادلة المتعلقة بالخدمات
    الحكومية الرقمية وتشمل معايير الاستخدام والتوظيف الامثل لمشاريع تقنية المعلومات والاتصالات من قبل الجهات الحكومية الاتحادية. 7. تنسيق برامج ومشاريع حكومة الامارات في مجال التقنيات والتطور الرقميء وتقديم الاستشارات التقنية لمختلف الجبات الحكومية الاتحادية. لضمان توفر بيئة رقمية متطورة. 8. اعداد وتنفيذ وادارة برامج ومشاريع التحول الرقمي لخدمات حكومة الامارات بالتنسيق مع الجبات المعنية. وفق افضل الممارسات العالمية في تصميم وتطوير وتقديم الخدمات. 9. انشاء وادارة الممكنات الحكومية الرقمية شاملة الانظمة والشبكات والبنية التحتية الحكومية الرقمية المشتركة في الحكومة الاتحادية. وفق افضل الحلول والبرامج والمواصفات التقنية المتقدمة» بما يعزز من كفاءة وفعالية انظمة وبرامج الحكومة الاتحادية الرقمية», ويما يدعم التكامل والترابط بين مختلف الانظمة. 0. وضع المعايير والمواصفات التقنية للحكومة الرقمية ورفع تقارير لمجلس الوزراء عن مدي امتثال الجهات الحكومية الاتحادية لبذه المعايير والاشتراطات بما يعزز الكفاءة والتكامل. 1. التنسيق مع الجهات المعنية في الدولة لضمان امتثال الانظمة والممكنات الحكومية الرقمية
    والشبكات والبنية التحتية الحكومية الرقمية في الحكومة الاتحادية للمعايير والاشتراطات بما يعزز جاهزيتها للتصدي ومواجهة المخاطر والتهديدات. 2. تطوير وتنفيذ البرامج الحكومية لرفع مستوي جودة وكفاءة الخدمات الحكومية الرقمية وتقديم تجربة متعامل متميزة وسلسة. 3. تطوير وتنفيذ منظومة متكاملة لمتابعة وتقييم اداء خدمات حكومة الامارات الرقمية لرفع مستوي جودة وكفاءة الخدمات وتقديم تجربة متعامل متميزة وسلسة. مرسوم بقانون اتحادي لسنة 2003 في شان تنظيم قطاع الاتصالات ظ 7 الشؤون المالية'
