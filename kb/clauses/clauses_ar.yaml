- record_id: UAE-PDPL-2021
  article: '2'
  text_ar: 'المادة (2) نطاق سريان المرسوم بقانون 1. تسري احكام هذا المرسوم بقانون علي معالجة البيانات الشخصية سواء كلها او جزء منها عن طريق وسائل الانظمة الالكترونية التي تعمل بشكل تلقائي والي» او غيرها من الوسائل الاخريء وذلك من قبل: ا. كل صاحب بيانات يقيم في الدولة او له مقر عمل فيها. ب. كل متحكم او معالج متواجد في الدولة يقوم بمزاولة انشطة معالجة البيانات الشخصية لاصحاب البيانات في الدولة او خارجها. ج. كل متحكم او معالج متواجد خارج الدولة يقوم بمزاولة انشطة معالجة البيانات الشخصية لاصحاب البيانات في الدولة. للوووننمن الا انك 2 لا تسري احكام هذا المرسوم بقانون علي ما ياتي: ا. البيانات الحكومية. ب. الجهات الحكومية المتحكمة بالبيانات الشخصية او تلك التي تقوم بمعالجتها. ج. البيانات الشخصية لدي الجهات الامنية والقضائية. د. صاحب البيانات الذي يقوم بمعالجة بياناته لاغراض شخصية. ه البيانات الشخصية الصحية التي لديها تشريع ينظم حماية ومعالجة تلك البيانات. و. البيانات والمعلومات الشخصية المصرفية والائتمانية التي لديها تشريع ينظم حماية ومعالجة تلك البيانات. ز. الشركات والمؤسسات الواقعة في المناطق
    الحرة في الدولة ولديها تشريعات خاصة بحماية البيانات'
  sha256: 6e54ae20bb7cf535bab452cb36826c195ecaa2efe0b4e6539e4b8ab6b00125f3
