  article: '40'
  text_ar: 'المادة (40) الاحتيال الالكتروني يعاقب بالحبس مدة لا تقل عن سنة والغرامة التي لا تقل عن (250.000) مائتين وخمسين الف درهم ولا تزيد علي (1.000.000) مليون درهم, او باحدي هاتين العقوبتين: كل من استولي لنفسه او لغيره بغير حق علي مال منقول او منفعة او علي سند او توقيع هذا السند, وذلك بالاستعانة باي طريقة من الطرق الاحتيالية او باتخاذ اسم كاذب او انتحال صفة غير صحيحة عن طريق الشبكة المعلوماتية او نظام معلومات الكتروني او احدي وسائل تقنية المعلومات.'
