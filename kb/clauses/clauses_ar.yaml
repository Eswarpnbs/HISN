- record_id: UAE-FL-2-2019
  article: '16'
  text_ar: 'المادة (16) سرية المعلومات الخاصة بالمرضي والاستثناء منها دون الاخلال باية تشريعات سارية» يجب علي كل من يتداول المعلومات الخاصة بالمرضي المحافظة علي سريتهاء وعدم استخدامها لغير الاغراض الصحية. دون موافقة خطية من المريضء باستثناء اي من الحالات الاتية: 1. البيانات او المعلومات الصحية التي تطلها شركات التامين الصحي او اية جبة ممولة للخدمات الصحية فيما يتعلق بالخدمات الصحية التي يتلقاها المريضء لاغراض المراجعة او الموافقة او التحقق من الاستحقاقات المالية المتعلقة بتلك الخدمات. 2 اغراض البحث العلمي والسريريء بشرط عدم الكشف عن هوية المرضي ومراعاة الاخلاقيات والقواعد الخاصة بالبحوث العلمية. 3 اتخاذ الاجراءات الوقائية والعلاجية المتعلقة بالصحة العامة او للحفاظ علي صحة وسلامة المريمض اواي شخص اخر علي اتصال به. 5. بناء علي طلب الجبة الصحية لاغراض الرقابة والتفتيش والمحافظة علي الصحة العامة.'
  sha256: a9cd335a0f6fa74406500aad036d42588b64092b09d241b87df24d497154227e
