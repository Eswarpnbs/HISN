pack_id: uae-v0.2
jurisdiction: AE
rules:
  - id: HEALTH_LOCALISATION_01
    applies_to: [message_log_transfer]
    condition: {data_class: health, destination_country_not: AE}
    verdict: VIOLATION
    action: BLOCK_PROHIBITED
    basis: FEDERAL_LAW
    citation:
      record_id: UAE-FL-2-2019
      article: "Article (13)"
      quote: 'It is not permissible to store, process, generate or transform the health data and information outside State -which are related to the health services provided inside State- except in the case where a resolution is issued from the Health Authority in coordination with the Ministry.'
      penalty: "Article (24): AED 500,000-700,000"
      exception: "Requires a prior resolution from the Health Authority in coordination with the Ministry"
      language: "en (official English translation; Arabic text is authoritative)"
    zone: RED
