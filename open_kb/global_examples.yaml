examples:
- gap: G1
  jurisdiction: Australia
  instrument: Scams Prevention Framework Act 2025
  summary: Places scam prevention obligations on banks, telecommunications providers and digital platforms, with consequences for non-compliance.
  url: https://www.afca.org.au/about-afca/scams-prevention-framework
  status: verified_official
  checked: '2026-10-30'
- gap: G1
  jurisdiction: Australia
  instrument: Industry Code C661:2022 Reducing Scam Calls and Scam SMs (registered by the ACMA under Part 6 of the Telecommunications Act 1997)
  summary: Obliges carriers and carriage service providers to protect consumers from scam harms and disrupt scam activity, including reporting scam calls and SMS blocked to the ACMA; enforced through ACMA directions to comply.
  url: https://www.acma.gov.au/sites/default/files/2025-08/TeleSign%20-%20Investigation%20report%20-%20Reducing%20Scams%20Code%20-%209%20April%202025.pdf
  status: verified_official
  checked: '2026-10-30'
- gap: G2
  jurisdiction: Australia
  instrument: SMS Sender ID Register (commenced 1 July 2026)
  summary: Registered sender IDs, including government agencies, keep their name; unregistered sender IDs must be labelled 'Unverified' by the carrier; penalties up to AUD 250,000 per contravention.
  url: https://www.acma.gov.au/articles/2026-06/sms-sender-id-register-goes-live-help-protect-australians-scams
  status: verified_official
  checked: '2026-10-30'
  note: Australia labels rather than blocks unregistered sender IDs.
- gap: G3
  jurisdiction: European Union
  instrument: Regulation (EU) 2021/1232; reinstated in 2026 (reported as Regulation (EU) 2026/1881), applying until 3 April 2028
  summary: A specific, purpose-limited, temporary legal basis was needed for providers to voluntarily scan private communications (for child sexual abuse material only); Parliament rejected its extension and it expired after 3 April 2026. After a gap of several months, the Council gave final approval to reinstating it on 23 July 2026; the reinstated version excludes end-to-end encrypted communications.
  url: https://oeil.europarl.europa.eu/oeil/en/document-summary?id=1896266
  status: verified_official
  checked: '2026-10-30'
  url3: https://eur-lex.europa.eu/eli/reg/2026/1881/oj
  number_verified: 'Regulation (EU) 2026/1881 listed on EUR-Lex (checked 2026-11-07)'
  url2: https://www.consilium.europa.eu/en/press/press-releases/2026/07/23/fighting-child-sexual-abuse-online-interim-measure-protecting-children-now-reinstated/
  design_principles: Processing only where strictly necessary and proportionate; text-scanning technologies may detect patterns but must not be able to deduce the substance of communications (European Parliament position).
- gap: G4
  jurisdiction: European Union
  instrument: GDPR Article 49(1)(f); EDPB Guidelines 2/2018
  summary: Transfers abroad may rely on vital interests when the person cannot consent, but derogations are a last resort for specific, occasional situations, not systematic or repetitive transfers.
  url: https://www.edpb.europa.eu/sites/edpb/files/files/file1/edpb_guidelines_2_2018_derogations_en.pdf
  status: verified_official
  checked: '2026-10-30'
  note: Covers individual emergencies, not systematic AI-triggered failover.
- gap: G5
  jurisdiction: Australia (partial); European Union (none found)
  instrument: Industry Code C661:2022 Reducing Scam Calls and Scam SMs
  summary: 'Oversees filter outcomes: blocked scam calls and SMS are reported to the ACMA, and alleged scam SMS with alphanumeric sender IDs found not to be scams are shared with other providers and the ACMA. No instrument found that assigns authority to approve or override operators'' filter changes before deployment.'
  url: https://www.acma.gov.au/sites/default/files/2025-08/TeleSign%20-%20Investigation%20report%20-%20Reducing%20Scams%20Code%20-%209%20April%202025.pdf
  status: verified_official
  checked: '2026-10-30'
  rating: partial
- gap: G6
  jurisdiction: Australia
  instrument: Scams Prevention Framework; Australian Scams Ombudsman (AFCA) from 31 March 2027
  summary: Telcos are within the framework; consumers can seek compensation where businesses have not met their obligations (compliance-linked, not automatic). Australian Scams Ombudsman (AFCA) from 31 March 2027.
  url: https://www.afca.org.au/about-afca/scams-prevention-framework
  status: verified_official
  checked: '2026-10-30'
  url2: https://treasury.gov.au/sites/default/files/2025-01/p2025-623966.pdf
- gap: G7
  jurisdiction: Singapore
  instrument: IMDA Full SMS Sender ID Registry Regime (SSIR), operated by SGNIC
  summary: 'Partial: Singapore''s SMS Sender ID Registry covers A2P SMS from overseas, but registration needs a Singapore entity number (UEN); an overseas office may send only via a letter of authorisation from a Singapore-registered subsidiary or branch, and the operator states whitelisting protection applies to Singapore mobile numbers only. Unregistered senders are labelled Likely-SCAM. A route exists, but no mutual recognition of foreign essential senders.'
  url: https://www.imda.gov.sg/How-We-Can-Help/Anti-Scam-Measures
  status: verified_official
  checked: '2026-11-01'
