name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # verify_all.py checks pre-registration order from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest cryptography pymupdf
      - name: Unit and scenario tests
        run: python -m pytest -q
      - name: Independent verification (hashes of committed sources, clauses, audit chains, pre-registration)
        run: python tools/verify_all.py
