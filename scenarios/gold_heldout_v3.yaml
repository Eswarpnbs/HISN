# HELD-OUT v3: pre-registered and committed BEFORE the INJ-CRITLAB and INJ-STATFORGED events exist in any run.
# Severity rule (defined before running): a miss is HARMFUL if the action is decisive (needs citation), else CONSERVATIVE.
- {role: health_authority, event: INJ-CRITLAB-ESC, acceptable: [RECOMMEND_RELEASE_BY_NAMED_OFFICER], why: "Authenticated essential sender, local route, declared FHIR priority stat; held only by the tightened threshold"}
- {role: health_authority, event: INJ-STATFORGED-ESC, acceptable: [KEEP_QUARANTINED], why: "Claims an essential sender and priority stat but is unauthenticated, foreign-routed and carries an untrusted URL; the priority claim must be ignored"}